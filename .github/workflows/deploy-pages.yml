name: Deploy browser prototype to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Rust WebAssembly
        run: npm run build:wasm
      - name: Build frontend
        run: npm run build
      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A deploy-only rerun uses the outputs of the successful build job.
      - name: Wait for the uploaded Pages artifact
        id: artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          if [[ -z "$ARTIFACT_NAME" || ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The Pages build did not report an artifact name and ID."
            exit 1
          fi

          for attempt in {1..12}; do
            artifacts=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$ARTIFACT_NAME")
            count=$(jq -e '.total_count' <<< "$artifacts")
            if [[ "$count" == 1 ]] && jq -e --arg id "$ARTIFACT_ID" \
              '.artifacts[0] | (.id | tostring) == $id and .expired == false' \
              <<< "$artifacts" > /dev/null; then
              echo "Pages artifact $ARTIFACT_NAME (ID $ARTIFACT_ID) is visible."
              echo "id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$count" != 0 ]]; then
              echo "::error::Expected one active Pages artifact named $ARTIFACT_NAME with ID $ARTIFACT_ID."
              exit 1
            fi
            echo "Waiting for Pages artifact $ARTIFACT_NAME (check $attempt of 12)."
            if (( attempt < 12 )); then
              sleep 5
            fi
          done

          echo "::error::Pages artifact $ARTIFACT_NAME (ID $ARTIFACT_ID) did not become visible."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 11
        uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The artifact wait step did not report a valid ID.');
            }

            // deploy-pages@v5 lists artifacts by name through the Results API,
            // which can still be empty after the Actions REST API sees the upload.
            const oidcToken = await core.getIDToken();
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                owner, repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: oidcToken,
              },
            );
            core.setOutput('id', deployment.id);
            core.setOutput('pending', 'true');
            core.setOutput('page_url', deployment.page_url);
            core.info(`Created Pages deployment ${deployment.id} for artifact ${artifactId}.`);

            const deadline = Date.now() + 10 * 60_000;
            const terminalFailures = new Set([
              'deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost',
            ]);
            let interval = 5_000;
            while (Date.now() < deadline) {
              const delay = Math.min(interval, deadline - Date.now());
              await new Promise(resolve => setTimeout(resolve, delay));
              interval = Math.min(Math.round(interval * 1.5), 30_000);

              let status;
              try {
                const { data } = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                  {
                    owner, repo,
                    pages_deployment_id: deployment.id,
                    request: { signal: AbortSignal.timeout(15_000) },
                  },
                );
                status = data.status;
              } catch (error) {
                if (error.status && error.status < 500 && ![404, 429].includes(error.status)) {
                  throw error;
                }
                core.warning(`Could not read Pages deployment status: ${error.message}`);
                continue;
              }
              core.info(`Pages deployment status: ${status}`);
              if (status === 'succeed') {
                core.setOutput('pending', 'false');
                return;
              }
              if (terminalFailures.has(status)) {
                core.setOutput('pending', 'false');
                throw new Error(`Pages deployment ended with status ${status}.`);
              }
            }
            throw new Error('Timed out waiting for Pages deployment.');
      - name: Cancel pending Pages deployment
        if: ${{ (failure() || cancelled()) && steps.deployment.outputs.pending == 'true' }}
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$DEPLOYMENT_ID/cancel"
